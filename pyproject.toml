[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biography-of-you"
version = "0.1.0"
description = "A local, source-backed archive and searchable personal timeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dateutil>=2.9,<3",
    "ijson>=3.3,<4",
    "icalendar>=6,<8",
    "httpx>=0.28,<1",
    "pillow>=12,<14",
    "pillow-heif>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.56,<2"]

[project.scripts]
biography = "biography.cli:main"

[tool.setuptools.packages.find]
include = ["biography*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
